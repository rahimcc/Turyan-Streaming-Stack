services:
  kafka-stream:
    image: apache/kafka:latest
    container_name: kafka-stream
    hostname: kafka-stream
    ports:
      - "9097:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-stream:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-stream:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1200m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  connect:
    image: quay.io/debezium/connect:3.6
    container_name: connect
    depends_on:
      kafka-stream:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka-stream:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms256m"
    mem_limit: 1200m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
     # - erpnext-network   # needs to reach mariadb for the ERPNext connector
     # - twenty-network    # needs to reach postgres for the Twenty connector
    restart: unless-stopped


  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: schema-registry
    depends_on:
      kafka-stream:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-stream:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    mem_limit: 500m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped


  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka-stream
      - connect
      - schema-registry
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-stream:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      JAVA_OPTS: "-Xmx512m -Xms128m"
    mem_limit: 600m
    restart: unless-stopped

  oauth2-proxy:
      image: quay.io/oauth2-proxy/oauth2-proxy:latest
      container_name: oauth2-proxy-${SERVICE_NAME}
      command: --http-address=0.0.0.0:4180
      environment:
        OAUTH2_PROXY_PROVIDER: keycloak-oidc
        OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
        OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID}
        OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
        OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET}
        OAUTH2_PROXY_COOKIE_NAME: _oauth2_${SERVICE_NAME}
        OAUTH2_PROXY_EMAIL_DOMAINS: "*"
        OAUTH2_PROXY_UPSTREAMS: ${UPSTREAM_URL}
        OAUTH2_PROXY_REDIRECT_URL: ${REDIRECT_URL}
      ports: 
         - "${PROXY_PORT}:4180"
      extra_hosts:
         - "keycloak.turyan.site:10.0.0.12"

networks:
  default:
    name: data-platform
    external: true
  #erpnext-network:
   # external: true
  
  # twenty-network:
   # external: true

volumes:
  kafka-data: